ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.task.ApplicationKt.module ]
    }
}

database {
    driverClassName = "org.postgresql.Driver"
    
    # ローカル開発用デフォルト値
    host = "localhost"
    host = ${?PGHOST}
    port = 5432
    port = ${?PGPORT}
    name = "housework"
    name = ${?PGDATABASE}
    
    # JDBC URL を個別の変数から構築
    # Railway では PGHOST, PGPORT, PGDATABASE が自動的に提供される
    jdbcUrl = "jdbc:postgresql://"${database.host}":"${database.port}"/"${database.name}
    
    # JDBC_DATABASE_URL が設定されている場合はそちらを優先（手動設定用）
    jdbcUrl = ${?JDBC_DATABASE_URL}
    
    username = "housework"
    username = ${?PGUSER}
    password = "housework_password"
    password = ${?PGPASSWORD}
    maximumPoolSize = 10

    # RLS適用接続（非オーナー）。共通契約(#34)の環境変数名: APP_PGUSER / APP_PGPASSWORD
    app {
        username = "housework_app"
        username = ${?APP_PGUSER}
        password = "housework_app_password"   # ローカル専用の既定値。本番では必ず APP_PGPASSWORD を設定する
        password = ${?APP_PGPASSWORD}
        maximumPoolSize = 10
    }
}

jwt {
    secret = "your-256-bit-secret-key-for-development"
    secret = ${?JWT_SECRET}
    issuer = "housework-app"
    audience = "housework-users"
    realm = "Housework API"
    expiresInMs = 604800000  # 7日間 (7 * 24 * 60 * 60 * 1000)
}

# メール送信設定
# Gmail SMTP を使用する場合:
#   1. Google アカウントで2段階認証を有効化
#   2. アプリパスワードを生成: https://myaccount.google.com/apppasswords
#   3. 環境変数を設定
mail {
    # "smtp" を指定すると実際にメール送信、"logging" を指定するとログ出力のみ
    provider = "logging"
    provider = ${?MAIL_PROVIDER}
    
    smtp {
        host = "smtp.gmail.com"
        host = ${?SMTP_HOST}
        port = 587
        port = ${?SMTP_PORT}
        # TLS設定
        # - Gmail: 通常 587(STARTTLS) or 465(SSL)
        useStartTls = true
        useStartTls = ${?SMTP_USE_STARTTLS}
        startTlsRequired = true
        startTlsRequired = ${?SMTP_STARTTLS_REQUIRED}
        useSsl = false
        useSsl = ${?SMTP_USE_SSL}
        # 任意: JavaMailのSSL trust設定
        # HOCONのoptional substitutionは未設定だと「値が存在しない」扱いになり得るため、
        # 連結でデフォルト（空文字）を確実に残す。
        # - ENV未設定: "" になる
        # - ENV設定: ENV値 + ""（実質ENV値）になる
        sslTrust = ${?SMTP_SSL_TRUST}""
        # タイムアウト(ms)
        connectionTimeoutMs = 10000
        connectionTimeoutMs = ${?SMTP_CONNECTION_TIMEOUT_MS}
        timeoutMs = 10000
        timeoutMs = ${?SMTP_TIMEOUT_MS}
        username = ""
        username = ${?SMTP_USER}
        password = ""
        password = ${?SMTP_PASSWORD}
        fromAddress = ""
        fromAddress = ${?SMTP_FROM_ADDRESS}
        fromName = "Housework App"
        fromName = ${?SMTP_FROM_NAME}
    }

    # HTTP API型メール送信（SMTPがブロックされる環境向け）
    # - SendGrid: https://docs.sendgrid.com/api-reference/mail-send/mail-send
    sendgrid {
        apiKey = ""
        apiKey = ${?SENDGRID_API_KEY}
        fromAddress = ""
        fromAddress = ${?SENDGRID_FROM_ADDRESS}
        fromName = "Housework App"
        fromName = ${?SENDGRID_FROM_NAME}
    }
}

# Web Push通知設定
# VAPID鍵の生成: npx web-push generate-vapid-keys
webpush {
    vapid {
        # 公開鍵: フロントエンド（Service Worker登録時）でも使用
        publicKey = ""
        publicKey = ${?VAPID_PUBLIC_KEY}
        # 秘密鍵: バックエンドのみ、絶対に露出させない
        privateKey = ""
        privateKey = ${?VAPID_PRIVATE_KEY}
        # 連絡先: mailto: または https:// 形式
        subject = "mailto:example@example.com"
        subject = ${?VAPID_SUBJECT}
    }
}

# Pub/Sub設定（issue #71。リレー#72・subscriber#61が共通で使うクライアント基盤の設定値）
pubsub {
    # falseのときはPublisher/Subscriberを起動しない（ローカルでPub/Sub無しにAPIだけ動かすため）
    enabled = false
    enabled = ${?PUBSUB_ENABLED}

    # GCPプロジェクトID。エミュレータ利用時は任意の文字列でよい
    projectId = "housework-local"
    projectId = ${?PUBSUB_PROJECT_ID}

    # topic名（共通契約#34により固定。環境変数での上書きは想定しない）
    topicId = "domain-events"

    # subscription名（共通契約#34により固定。環境変数での上書きは想定しない）
    subscriptionId = "housework-backend"

    # "host:port"形式。設定されていればエミュレータに接続する。
    # 未設定の場合はHOCONのoptional substitutionの仕様によりキー自体が存在しなくなる
    # （PubSubConfig.fromConfigではhasPathで存在確認してから読む）。
    # 未設定なら本番（GCP）に接続する。認証はGOOGLE_APPLICATION_CREDENTIALS（ファイルパス）
    # またはGOOGLE_CREDENTIALS_JSON（JSON本文。Railway向け）のどちらか。
    emulatorHost = ${?PUBSUB_EMULATOR_HOST}
}
